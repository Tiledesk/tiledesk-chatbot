<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Executions Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tiledesk-dashboard shell (top bar + icon rail) with the real entry points: agents list cards → executions list → detail (timeline, flow state, audit), and the Activities page. Poppins, blue #1b6ef3, hairline #dfe3ed. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f8f9fc; --fg:#1f2a3d; --muted:#5d6b82; --faint:#8b97aa;
  --line:#dfe3ed; --line-strong:#c9d0de; --accent:#1b6ef3; --accent-weak:#e8f0fe; --accent-fg:#ffffff;
  --run:#1b6ef3; --run-bg:#e8f0fe; --wait:#5d6b82; --wait-bg:#eef1f6; --warn:#a15c00; --warn-bg:#fff3e0;
  --bad:#c62f2f; --bad-bg:#fdecec; --ok:#1f7a45; --ok-bg:#e6f4ec; --dead:#3b4250; --dead-bg:#e3e6eb;
  --scrim:rgba(20,28,45,.42); --shadow:0 12px 40px rgba(20,28,45,.18);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161f; --surface:#18202c; --surface-2:#1d2633; --fg:#e4e9f2; --muted:#a3aec0; --faint:#7d8899;
  --line:#2a3443; --line-strong:#3a4658; --accent:#5b97ff; --accent-weak:#1c2c48; --accent-fg:#0b1220;
  --run:#7aaeff; --run-bg:#1c2c48; --wait:#a3aec0; --wait-bg:#252f3d; --warn:#f2b45c; --warn-bg:#3a2c16;
  --bad:#ff8a80; --bad-bg:#3d1f22; --ok:#6fd39a; --ok-bg:#17352a; --dead:#c3cad6; --dead-bg:#2b323d;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161f; --surface:#18202c; --surface-2:#1d2633; --fg:#e4e9f2; --muted:#a3aec0; --faint:#7d8899;
  --line:#2a3443; --line-strong:#3a4658; --accent:#5b97ff; --accent-weak:#1c2c48; --accent-fg:#0b1220;
  --run:#7aaeff; --run-bg:#1c2c48; --wait:#a3aec0; --wait-bg:#252f3d; --warn:#f2b45c; --warn-bg:#3a2c16;
  --bad:#ff8a80; --bad-bg:#3d1f22; --ok:#6fd39a; --ok-bg:#17352a; --dead:#c3cad6; --dead-bg:#2b323d;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.brand .dot{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-size:12px;font-weight:600}
.crumbs{color:var(--muted)}
.spacer{flex:1}
.mock{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:20px;padding:3px 10px}
.role{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
main{max-width:1180px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:22px;font-weight:500;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:500;margin:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px}
.filters input[type=search],.filters select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.filters input[type=search]{flex:1 1 180px}
.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.counters{display:flex;gap:8px;flex-wrap:wrap}
.counter{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.counter b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.counter[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--fg)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 10px 2px 8px;font-size:12px;font-weight:500}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-running{color:var(--run);background:var(--run-bg)} .s-waiting{color:var(--wait);background:var(--wait-bg)}
.s-stopping,.s-stopped{color:var(--warn);background:var(--warn-bg)} .s-failed{color:var(--bad);background:var(--bad-bg)}
.s-completed{color:var(--ok);background:var(--ok-bg)} .s-destroyed{color:var(--dead);background:var(--dead-bg);text-decoration:line-through}
@media (prefers-reduced-motion:no-preference){.s-running::before,.s-stopping::before{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
.trig{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.trig svg{width:14px;height:14px}
.fail{color:var(--bad);font-weight:500}
.warnicon{color:var(--warn);margin-left:4px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.counter:focus-visible,.seg button:focus-visible,a:focus-visible,tbody tr:focus-visible,.step-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--accent);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.link:hover{text-decoration:underline}
.back{font-size:13px}
.ex-head{padding:16px;display:grid;gap:10px}
.ex-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls .spacer{flex:1}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--accent-weak);color:var(--fg)}
.lineage{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tl-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.step-row{display:grid;grid-template-columns:94px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.step-row:hover{background:var(--surface-2)}
.step-row[aria-expanded="true"]{background:var(--surface-2)}
.step-ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600}
.o-success{background:var(--ok-bg);color:var(--ok)} .o-failure_condition{background:var(--warn-bg);color:var(--warn)}
.o-error{background:var(--bad-bg);color:var(--bad)} .o-interrupted{background:var(--dead-bg);color:var(--dead)}
.o-running{background:var(--run-bg);color:var(--run)}
.step-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{padding:4px 16px 12px 142px;border-bottom:1px solid var(--line);background:var(--surface-2);display:grid;gap:6px}
@media (max-width:640px){.step-row{grid-template-columns:22px minmax(0,1fr) auto}.step-row .when{display:none}.actions{padding-left:16px}}
.act{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.act .k{color:var(--muted)}
.side{display:grid;gap:16px}
.side .card{padding:14px 16px;display:grid;gap:10px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.audit-mini{display:grid;gap:8px;font-size:12.5px}
.audit-mini div{display:grid;gap:2px}
.sealed{border:1px dashed var(--accent);border-radius:10px;padding:14px 16px;display:grid;gap:10px;background:var(--accent-weak)}
.sealed-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
pre.json{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:pre}
.secret{color:var(--faint)}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(480px,100%);padding:20px;display:grid;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.dialog h2{font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.opt small{grid-column:2;color:var(--muted)}
.field{display:grid;gap:6px}
.field input,.field textarea{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface)}
.field .err{color:var(--bad);font-size:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.tip{position:relative}
.note{font-size:12px;color:var(--muted)}
@media (max-width:720px){
  .tbl-wrap table thead{display:none}
  .tbl-wrap table,.tbl-wrap tbody,.tbl-wrap tr,.tbl-wrap td{display:block;width:100%}
  .tbl-wrap tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl-wrap td{border:0;padding:2px 0;white-space:normal}
  .tbl-wrap td[data-l]::before{content:attr(data-l) " · ";color:var(--faint);font-size:12px}
}
/* Dashboard shell: icon rail on the left (like tiledesk-dashboard's sidebar), page column on the right. */
.shell{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0}
.rail a{width:58px;display:grid;justify-items:center;gap:2px;padding:7px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-size:10.5px}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--surface-2);color:var(--fg)}
.rail a[aria-current="page"]{background:var(--accent-weak);color:var(--accent)}
.rail a.off{opacity:.45;pointer-events:none}
@media (max-width:640px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;justify-content:space-around;border-right:0;border-bottom:1px solid var(--line);padding:4px 8px;position:sticky;top:0;z-index:5}
  .rail a{width:auto;flex:1}
}
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumb a{color:var(--accent);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;display:grid;gap:10px;align-content:start}
.agent-top{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;flex:none}
.avatar svg{width:20px;height:20px}
.agent-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-type{font-size:12px;color:var(--muted)}
.agent-acts{display:flex;gap:2px;border-top:1px solid var(--line);padding-top:8px;align-items:center}
.ibtn{position:relative;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:19px;height:19px}
.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ibtn.new{color:var(--accent)}
.badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.badge.live{background:var(--run);min-width:10px;width:10px;height:10px;padding:0;top:5px;right:5px}
.newtag{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 6px;margin-left:auto}
.menu{position:absolute;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:grid}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:center}
.menu button svg{width:17px;height:17px;color:var(--muted)}
.menu button:hover{background:var(--surface-2)}
.menu button.hl{color:var(--accent)} .menu button.hl svg{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.vars{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vars th{font-size:11.5px;padding:7px 10px;background:var(--surface-2)}
.vars td{padding:7px 10px;white-space:normal;vertical-align:top;cursor:default}
.vars tbody tr{cursor:default}
.vars tr.chg td{background:color-mix(in srgb,var(--accent-weak) 70%,transparent)}
.vars tr.var-row{cursor:pointer}
.vars td.k{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.mask{color:var(--faint);font-family:var(--mono);font-size:12px}
.val{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.by{font-size:12px;color:var(--muted)}
.tag{font-size:10.5px;border-radius:5px;padding:0 5px;background:var(--wait-bg);color:var(--wait);margin-left:6px;font-family:var(--font)}
.state-head{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.outside{display:flex;gap:10px;align-items:center;padding:6px 16px 6px 142px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--surface-2) 8px 16px)}
@media (max-width:640px){.outside{padding-left:16px}}
.vc{font-size:12px;color:var(--accent);white-space:nowrap}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pick select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;max-width:100%}
.panel-pad{padding:12px 16px;display:grid;gap:10px}
.hist{display:grid;gap:6px;font-size:12.5px}
.hist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.act-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:0}
.act-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent)}
.act-ic svg{width:17px;height:17px}
.act-ic.old{background:var(--surface-2);color:var(--muted)}
.act-text{font-size:13.5px;min-width:0}
.act-text .note{display:block;margin-top:2px}
.act-when{font-size:12px;color:var(--muted);white-space:nowrap}
.hidden-note{padding:10px 16px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
</style>

<header class="top">
  <div class="brand"><div class="dot" aria-hidden="true">td</div><span>Lab Nico</span></div>

  <div class="spacer"></div>
  <div class="role">Viewing as
    <div class="seg" role="group" aria-label="Role">
      <button id="role-owner" aria-pressed="true" data-role="owner">Owner</button>

</header>
<div class="shell">
  <nav class="rail" aria-label="Dashboard">
    <a class="off" href="#" aria-hidden="true" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg>Home</a>
    <a class="off" href="#" aria-hidden="true" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>Chats</a>
    <a href="#agents" id="nav-agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>Agents</a>
    <a class="off" href="#" aria-hidden="true" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5h11l5 5v9z"/></svg>KB</a>

</div>

<script>
const SVG=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${p}</svg>`;

/* ---------- flow state: replay the writes to know the state before / after each block ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
function replay(e){
  let cur=clone(e.init||{}); const out=[];
  e.steps.forEach((s,i)=>{
    const outsideCh=[];
    if(s.outside){for(const [k,v] of Object.entries(s.outside.w)){outsideCh.push({key:k,before:cur[k],after:v,by:s.outside.by});cur[k]=v}}
    const before=clone(cur); const by={};
    s.actions.forEach(a=>{for(const [k,v] of Object.entries(a.w||{})){if(v===undefined)delete cur[k];else cur[k]=v;by[k]=a.type+' "'+a.title+'"'}});
    const after=clone(cur);
    out.push({before,after,by,outsideCh});
  });
  return out;
}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function typeOf(v){return v===null?'null':Array.isArray(v)?'array':typeof v}
function sizeOf(v){return v===undefined?0:new Blob([JSON.stringify(v)]).size}
const covers=(e,i)=>grant&&grant.ex===e.id&&(grant.scope==='execution'||grant.step===i);
function shown(v,open){
  if(v===undefined) return '<span class="muted">—</span>';
  if(open) return `<span class="val">${esc(JSON.stringify(v))}</span>`;
  return `<span class="mask">••• </span><span class="note">${typeOf(v)}, ${sizeOf(v)} B</span>`;
}
function changedKeys(st){const ks=new Set([...Object.keys(st.before),...Object.keys(st.after)]);return [...ks].filter(k=>!same(st.before[k],st.after[k]))}

function allowed(e){
  const s=e.status, un=UNATTENDED.includes(e.trigger);
  return {
    soft:['running','waiting'].includes(s), hard:['running','waiting','stopping'].includes(s),
    resume:['stopped','failed'].includes(s)&&e.checkpoint,
    startNew:un&&['stopped','failed','completed','destroyed'].includes(s),
    destroy:['running','waiting','stopping','stopped','failed'].includes(s)
  };
}

}

/* ---------- execution detail ---------- */
function controlsHtml(e){
  const a=allowed(e), owner=isOwner(); const b=[];
  if(a.soft||a.hard) b.push(`<button class="btn" id="c-stop">${IC.stop}${e.status==='stopping'?'Hard stop now':'Stop…'}</button>`);
  if(a.resume) b.push(`<button class="btn primary" id="c-resume">${IC.play}Resume</button>`);
  if(['stopped','failed'].includes(e.status)&&!e.checkpoint) b.push(`<span class="note">No checkpoint: this execution cannot be resumed</span>`);
  if(a.startNew) b.push(`<button class="btn" id="c-new">Start new</button>`);
  if(a.destroy) b.push(`<button class="btn danger" id="c-destroy" ${owner?'':'disabled title="Only the project owner can destroy executions"'}>Destroy</button>`);
  b.push('<span class="spacer"></span>');
  b.push(`<button class="btn" id="c-data">${IC.lock}View data</button>`);
  return b.join('');
}
function statusBanner(e){
  if(e.status==='failed') return `<div class="banner bad"><b style="font-weight:500">${esc(e.err)}</b>&nbsp;${esc(e.errText)}</div>`;
  if(e.status==='waiting') return `<div class="banner info">${esc(e.waitText||'Waiting for a reply')}</div>`;
  if(e.status==='stopped') return `<div class="banner warn">${esc(e.stopText||'Stopped')}</div>`;
  if(e.status==='stopping') return `<div class="banner warn">Soft stop requested: the current action finishes, then the execution stops.</div>`;
  if(e.status==='destroyed') return `<div class="banner warn">Destroyed by ${esc(e.destroyedBy||'Nico Cardone')}. Live state removed; the trace and audit are kept.</div>`;
  return '';
}
function stateTable(e,i,st){

      ${open?'<span class="note">values open · recorded in the audit log</span>':`<button class="link" data-vals="${i}">View values</button>`}</div>
    <div class="tbl-wrap"><table class="vars"><thead><tr><th>Variable</th><th>Before</th><th>After</th><th>Changed by</th></tr></thead><tbody>
    ${ch.map(k=>`<tr class="chg"><td class="k">${esc(k)}${RESERVED.has(k)?'<span class="tag">system</span>':''}</td><td data-l="Before">${shown(st.before[k],open)}</td><td data-l="After">${shown(st.after[k],open)}</td><td data-l="Changed by" class="by">${esc(st.by[k]||'')}</td></tr>`).join('')}
    ${un.map(k=>`<tr><td class="k">${esc(k)}${RESERVED.has(k)?'<span class="tag">system</span>':''}</td><td data-l="Before">${shown(st.before[k],open)}</td><td data-l="After" class="muted">= unchanged</td><td></td></tr>`).join('')}
    ${!keys.length?'<tr><td colspan="4" class="muted">No user variables yet. Tick "Show system variables" to see the reserved ones.</td></tr>':''}
    </tbody></table></div>`;
}
function renderDetail(e){

function timelineHtml(e,st){

        <span style="display:grid;justify-items:end;gap:2px"><span class="mono muted">${s.dur}</span>${nch?`<span class="vc">${nch} var${nch>1?'s':''} changed</span>`:''}</span>
      </div>
      ${openStep===e.id+':'+s.i?`<div class="actions">${s.actions.map(a=>`
        <div class="act"><b style="font-weight:500">${esc(a.type)}</b><span class="muted">${esc(a.title)}</span>
          <span><span class="k">outcome</span> ${a.outcome.replace('_',' ')}</span><span><span class="k">exit</span> ${esc(a.exit)}</span>
          <span><span class="k">time</span> ${a.dur}</span>${a.err?`<span><span class="k">error</span> <span class="mono">${a.err}</span></span>`:''}
          <span><span class="k">wrote</span> ${Object.keys(a.w||{}).length?`<span class="mono">${Object.keys(a.w).map(esc).join(', ')}</span>`:'—'}</span>
        </div>`).join('')}
        ${stateTable(e,s.i,x)}</div>`:''}`}).join('')}
    ${e.status==='running'?'<div class="step-row" style="cursor:default"><span class="when"></span><span class="step-ic o-running">…</span><span class="muted">running…</span><span></span></div>':''}`;
}
function stateTabHtml(e,st){
  if(fsStep==null||fsStep>=e.steps.length) fsStep=e.steps.length-1;
  const i=fsStep, x=st[i], state=fsWhen==='before'?x.before:x.after, open=covers(e,i);

      <label class="check"><input type="checkbox" class="sys-t" ${showSys?'checked':''}> Show system variables</label>
      <span class="spacer" style="flex:1"></span>${open?'<span class="note">values open</span>':`<button class="link" data-vals="${i}">View values</button>`}</div>
    <div class="panel-pad">
      <div class="note">The whole flow state ${fsWhen} "${esc(e.steps[i].name)}": ${keys.length} variable${keys.length===1?'':'s'}. Click one for its history in this execution.</div>
      <div class="tbl-wrap"><table class="vars"><thead><tr><th>Variable</th><th>Value</th><th>Type</th><th>Size</th></tr></thead><tbody>
      ${keys.map(k=>`<tr class="var-row ${fsKey===k?'chg':''}" data-key="${esc(k)}" tabindex="0"><td class="k">${esc(k)}${RESERVED.has(k)?'<span class="tag">system</span>':''}</td><td data-l="Value">${open?`<span class="val">${esc(JSON.stringify(state[k]))}</span>`:'<span class="mask">•••</span>'}</td><td data-l="Type" class="muted">${typeOf(state[k])}</td><td data-l="Size" class="muted">${sizeOf(state[k])} B</td></tr>`).join('')}
      </tbody></table></div>
      ${hist?`<div><h2 style="margin-bottom:8px">History of <span class="mono">${esc(fsKey)}</span></h2><div class="hist">${hist.map(h=>`<div><span class="muted">${esc(h.when)}</span><span>${esc(h.by)}</span><span></span><span>${shown(h.before,covers(e,h.i))} → ${shown(h.after,covers(e,h.i))}</span></div>`).join('')||'<span class="note">Not changed in this execution.</span>'}</div></div>`:''}
    </div>`;

function historyOf(e,st,key){
  const out=[];
  st.forEach((x,i)=>{
    x.outsideCh.filter(c=>c.key===key).forEach(c=>out.push({i,when:'before "'+e.steps[i].name+'"',by:c.by==='message_in'?'incoming message':'outside the flow',before:c.before,after:c.after}));
    let prev=x.before[key];
    e.steps[i].actions.forEach(a=>{if(a.w&&key in a.w){out.push({i,when:'block "'+e.steps[i].name+'"',by:a.type+' "'+a.title+'"',before:prev,after:a.w[key]});prev=a.w[key]}});
  });
  return out;
}
function auditTabHtml(e,list){

    <div class="audit-mini">${list.length?list.map(x=>`<div><span class="muted">${x.at} · ${esc(x.who)}</span><span>${esc(verbLabel(x.verb))}</span><span class="note">${esc(x.details)}</span></div>`).join(''):'<span class="note">Nothing recorded yet.</span>'}</div>

function bindTab(e,st){

function liveTick(e){
  if(location.hash!=='#exec-'+e.id||e.status!=='running'){clearInterval(liveTimer);return}
  const last=e.steps[e.steps.length-1];
  if(last.outcome==='running'){last.outcome='success';last.sub='Web request · true exit';last.dur='1.4 s';const t=last.actions[0].title;last.actions[0]=act('Web request v2',t,'success','true','1.4 s',e.steps.length===3?{erp_order_ref:'ERP-88310',erp_status:201}:{notified:true})}
  else if(e.steps.length<6){const n=e.steps.length;const names=['Notify warehouse','Update customer','Log result'];e.steps.push({t:'10:41:1'+(3+n)+'.0'+n+'0',name:names[(n-3)%3],outcome:'running',sub:'in progress',dur:'',actions:[act(n%2?'Send email':'Web request v2',names[(n-3)%3],'running','—','…',{})]})}
  else {e.status='waiting';e.waitText='Chain finished, waiting for the next message';e.dur='9.8 s';toast('Order sync is now waiting')}

/* ---------- dialogs ---------- */
function dialog(html,bind){
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#scrim').onclick=ev=>{if(ev.target.id==='scrim')close()};
  document.onkeydown=ev=>{if(ev.key==='Escape')close()};
  const f=$('.dialog input,.dialog textarea,.dialog button.primary,.dialog button.danger');if(f)f.focus();
  bind&&bind();
}
function close(){$('#layer').innerHTML='';document.onkeydown=null}
function stopDialog(e){
  const cur=e.steps[e.steps.length-1]; const idle=e.status==='waiting';
  dialog(`<h2>Stop execution</h2>
   ${idle?'<p>Nothing is running right now: the execution stops at once and no new message will run the agent until you resume it.</p>':''}
   <label class="opt"><input type="radio" name="mode" value="soft" checked><span>Soft stop</span><small>Let ${idle?'the next block':`"${esc(cur.name)}"`} finish its current action, then stop.</small></label>
   <label class="opt"><input type="radio" name="mode" value="hard"><span>Hard stop</span><small>${idle?'Stop now.':`Interrupt "${esc(cur.name)}" now. It will run again from the start on resume.`}</small></label>
   <div class="dlg-actions"><button class="btn" id="d-cancel">Cancel</button><button class="btn primary" id="d-ok">Stop</button></div>`,()=>{
    $('#d-cancel').onclick=close;
    $('#d-ok').onclick=()=>{const m=document.querySelector('input[name=mode]:checked').value;close();
      if(m==='hard'||idle){doHardStop(e,idle&&m==='soft')}
      else {audit('EXECUTION_STOP_SOFT',e,'requested');e.status='stopping';renderDetail(e);toast('Soft stop requested');
        setTimeout(()=>{const last=e.steps[e.steps.length-1];if(last.outcome==='running'){last.outcome='success';last.sub='finished, then stopped';last.dur='1.2 s';last.actions[0].outcome='success';last.actions[0].w={erp_order_ref:'ERP-88310'}}
          e.status='stopped';e.stopText='Soft stop by '+ME[role]+' · resume continues with the next block';e.interrupted=false;if(location.hash==='#exec-'+e.id)renderDetail(e);toast('Execution stopped')},2200)}
    }});
}
function doHardStop(e,soft){
  const last=e.steps[e.steps.length-1];
  audit(soft?'EXECUTION_STOP_SOFT':'EXECUTION_STOP_HARD',e,last.outcome==='running'?`"${last.name}" interrupted`:'nothing running');
  if(last.outcome==='running'){last.outcome='interrupted';last.sub='interrupted by hard stop';last.dur='0.6 s';last.actions[0].outcome='interrupted';e.interrupted=true;
    e.stopText=`Hard stop by ${ME[role]} · "${last.name}" interrupted, it will run again on resume`}
  else e.stopText=`Stopped by ${ME[role]} while waiting`;
  e.status='stopped';renderDetail(e);toast('Execution stopped');
}
function resumeDialog(e){
  const last=e.steps[e.steps.length-1];
  const rerun=e.interrupted||e.status==='failed';
  const callsOut=rerun&&last.actions.some(a=>CALLS_OUT.includes(a.type));
  dialog(`<h2>Resume execution</h2>
   <p>${rerun?`Continues by running "${esc(last.name)}" again`:'Continues with the next block'}, using version ${e.version} (the one that was running), with the flow state as it was before that block.</p>
   ${callsOut?`<div class="banner warn">⚠ "${esc(last.name)}" calls an external system (${esc(last.actions[0].type)}) and may already have reached it. Running it again can repeat that call.</div>`:''}
   ${!e.conv?'<p class="note">The original caller is no longer waiting: the result will not be returned to it.</p>':''}
   <div class="dlg-actions"><button class="btn" id="d-cancel">Cancel</button><button class="btn primary" id="d-ok">${callsOut?'Run it again and resume':'Resume'}</button></div>`,()=>{
    $('#d-cancel').onclick=close;
    $('#d-ok').onclick=()=>{close();audit('EXECUTION_RESUME',e,callsOut?`confirmed rerun of "${last.name}"`:'from checkpoint');
      if(rerun){last.outcome='running';last.sub='running again after resume';last.dur='';last.actions.forEach(a=>{a.outcome='running';a.err=null})}
      e.status='running';e.err=null;e.interrupted=false;toast('Execution resumed');renderDetail(e);
      setTimeout(()=>{last.outcome='success';last.sub='succeeded after resume';last.dur='0.9 s';last.actions.forEach(a=>{a.outcome='success';a.exit='true';a.dur='0.9 s';if(a.type==='Web request v2')a.w={last_status:200,status_body:{ok:true}}});
        e.status='completed';e.dur='—';if(location.hash==='#exec-'+e.id)renderDetail(e);toast(e.agent+' completed')},3500)}
  });
}

}
function destroyDialog(e){
  dialog(`<h2>Destroy execution</h2>
   <p>This ${['running','stopping'].includes(e.status)?'hard-stops it, ':''}${e.conv?'closes its conversation, ':''}and removes its live state and checkpoints. It cannot be resumed afterwards. The trace, data and audit are kept for their retention period.</p>
   <div class="field"><label for="d-confirm">Type <span class="mono">${e.id.slice(0,6)}</span> to confirm</label><input id="d-confirm" autocomplete="off"><span class="err" id="d-err" hidden></span></div>
   <div class="dlg-actions"><button class="btn" id="d-cancel">Cancel</button><button class="btn danger solid" id="d-ok">Destroy</button></div>`,()=>{
    $('#d-cancel').onclick=close;
    $('#d-confirm').oninput=()=>{$('#d-err').hidden=true};
    $('#d-ok').onclick=()=>{if($('#d-confirm').value.trim()!==e.id.slice(0,6)){const er=$('#d-err');er.textContent='Type '+e.id.slice(0,6)+' exactly to confirm.';er.hidden=false;return}
      close();audit('EXECUTION_DESTROY',e,e.conv?'conversation closed':'no conversation');e.status='destroyed';e.checkpoint=false;e.destroyedBy=ME[role];toast('Execution destroyed');renderDetail(e)}
  });
}
function dataDialog(e,stepIdx){
  const stepName=stepIdx!=null?e.steps[stepIdx].name:null;
  dialog(`<h2>View execution data</h2>
   <p>The data is sealed. Opening it is recorded in the audit log (and in Activities) with your name and reason. The access lasts 15 minutes.</p>
   <label class="opt"><input type="radio" name="scope" value="step" ${stepName?'checked':'disabled'}><span>This block${stepName?`: "${esc(stepName)}"`:''}</span><small>${stepName?'Inputs and outputs of its actions, and the flow variable values before and after it.':'Pick "View values" on a block.'}</small></label>
   <label class="opt"><input type="radio" name="scope" value="execution" ${stepName?'':'checked'}><span>Whole execution</span><small>Trigger payload, every block's data and every variable value.</small></label>
   <div class="field"><label for="d-reason">Reason <span class="muted">(required)</span></label><textarea id="d-reason" rows="2" placeholder="e.g. investigating the HTTP 500 from the status API"></textarea><span class="err" id="d-err" hidden></span></div>
   <div class="dlg-actions"><button class="btn" id="d-cancel">Cancel</button><button class="btn primary" id="d-ok">Request access</button></div>`,()=>{
    $('#d-cancel').onclick=close;
    $('#d-reason').oninput=()=>{$('#d-err').hidden=true};
    $('#d-ok').onclick=()=>{const r=$('#d-reason').value.trim();if(r.length<10){const er=$('#d-err');er.textContent='Write at least 10 characters so the reason is clear to whoever reads the audit log.';er.hidden=false;return}
      const scope=document.querySelector('input[name=scope]:checked').value;close();
      audit('EXECUTION_DATA_ACCESS',e,`reason "${r}" · `+(scope==='step'?'block "'+stepName+'"':'whole execution'));
      grant={ex:e.id,scope,step:stepIdx,until:Date.now()+15*60*1000};renderDetail(e);
      document.getElementById('sealed-slot').scrollIntoView({behavior:'smooth',block:'start'})}
  });
}
function sampleData(e,idx){
  const s=e.steps[idx]; const a=s.actions[0];
  if(a.type==='Web request v2') return {action:a.type+' · '+a.title,input:{method:a.title.split(' ')[0],url:'https://ops.example.com/api/'+a.title.split(' ').pop().toLowerCase(),headers:{Authorization:'[secret]','X-Api-Key':'[secret]',Accept:'application/json'}},output:a.err?{status:500,body:{error:'upstream timeout',node:'db-2'}}:{status:200,body:{ok:true}}};
  if(a.type==='AI prompt'||a.type==='Ask KB') return {action:a.type+' · '+a.title,input:{prompt:'Summarise the overnight checks for the on-call team.'},output:{text:a.outcome==='failure_condition'?null:'All checks passed except disk usage on db-2 (91%).'}};
  return {action:a.type+' · '+a.title,input:{},output:{}};
}
function hl(json){return esc(JSON.stringify(json,null,2)).replace(/&quot;\[secret\]&quot;/g,'<span class="secret">[secret]</span>')}
function renderSealed(e){
  const slot=$('#sealed-slot');if(!slot)return;
  const idxs=grant.scope==='step'?[grant.step]:e.steps.map((_,i)=>i);
  slot.innerHTML=`<section class="sealed" aria-label="Sealed data">
    <div class="sealed-head"><h2>Sealed data open</h2><span class="note" id="countdown"></span><span style="flex:1"></span><button class="btn" id="seal-close">Close data</button></div>
    <p class="note" style="margin:0">Variable values are now shown in the Flow state tables for ${grant.scope==='step'?'block "'+esc(e.steps[grant.step].name)+'"':'every block'}. Action inputs and outputs:</p>
    ${grant.scope==='execution'?`<div><div class="note">Trigger payload</div><pre class="json">${hl({payload:e.steps[0].actions[0].w})}</pre></div>`:''}
    ${idxs.map(i=>`<div><div class="note">${esc(e.steps[i].name)}</div><pre class="json">${hl(sampleData(e,i))}</pre></div>`).join('')}
    <p class="note">Values named like secrets are never stored and show as [secret]. Nothing is cached on this device.</p></section>`;
  $('#seal-close').onclick=()=>{grant=null;clearInterval(grantTimer);renderDetail(e)};
  clearInterval(grantTimer);
  const tick=()=>{const left=Math.max(0,grant?grant.until-Date.now():0);const el=$('#countdown');if(!el){clearInterval(grantTimer);return}
    if(left<=0){grant=null;clearInterval(grantTimer);renderDetail(e);toast('Data access expired');return}
    el.textContent='Access expires in '+Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0')+' · recorded in the audit log'};
  tick();grantTimer=setInterval(tick,1000);
}

/* ---------- Activities page (activities-new) with the new Executions group ---------- */
const VERBS={EXECUTION_STOP_SOFT:'Soft stop',EXECUTION_STOP_HARD:'Hard stop',EXECUTION_RESUME:'Resume',EXECUTION_START_NEW:'Start new',EXECUTION_DESTROY:'Destroy',EXECUTION_DATA_ACCESS:'Data access',EXECUTION_DATA_ACCESS_DENIED:'Data access denied'};
const verbLabel=v=>VERBS[v]||v;
const VERB_IC={EXECUTION_STOP_SOFT:'stop',EXECUTION_STOP_HARD:'stop',EXECUTION_RESUME:'play',EXECUTION_START_NEW:'plus',EXECUTION_DESTROY:'trash',EXECUTION_DATA_ACCESS:'lock',EXECUTION_DATA_ACCESS_DENIED:'deny'};
function sentence(x){
  const ex=`<a class="link mono" href="#exec-${x.ex}">${x.ex.slice(0,6)}</a>`, ag=`<b>${esc(x.agent)}</b>`, w=`<b>${esc(x.who)}</b>`;
  return {EXECUTION_STOP_SOFT:`${w} soft-stopped execution ${ex} of ${ag}`,EXECUTION_STOP_HARD:`${w} hard-stopped execution ${ex} of ${ag}`,EXECUTION_RESUME:`${w} resumed execution ${ex} of ${ag}`,
    EXECUTION_START_NEW:`${w} started a new execution of ${ag} from ${ex}`,EXECUTION_DESTROY:`${w} destroyed execution ${ex} of ${ag}`,
    EXECUTION_DATA_ACCESS:`${w} viewed the data of execution ${ex} of ${ag}`,EXECUTION_DATA_ACCESS_DENIED:`${w} was denied access to the data of execution ${ex} of ${ag}`}[x.verb];
}
function renderActivities(){
  const exRows=isOwner()?auditLog.map(x=>({ts:x.ts,at:x.at,icon:VERB_IC[x.verb],text:sentence(x),note:x.details,verb:x.verb,isEx:true})):[];
  let rows=exRows.concat(OTHER_ACTIVITIES.map(o=>({...o,verb:'OTHER'})));
  if(actFilter==='EXECUTIONS') rows=rows.filter(r=>r.isEx); else if(actFilter) rows=rows.filter(r=>r.verb===actFilter);
  rows.sort((a,b)=>b.ts-a.ts);
  $('#app').innerHTML=`
  <div class="head"><div><h1>Activities</h1><div class="sub">The existing Activities page. New: the <b style="font-weight:500">Executions</b> group, fed by the executions audit.</div></div></div>
  <section class="card">
    <div class="filters">
      <select aria-label="Period"><option>Last 7 days</option><option>Last 30 days</option></select>
      <select aria-label="Teammate"><option>All teammates</option></select>
      <select id="a-type" aria-label="Activity type">
        <option value="">All activity types</option>
        <optgroup label="Conversations"><option value="X1" disabled>Conversation created</option><option value="X2" disabled>Conversation closed</option></optgroup>
        <optgroup label="Chatbot"><option value="X3" disabled>Flow published</option></optgroup>
        <optgroup label="Executions (new)"><option value="EXECUTIONS" ${actFilter==='EXECUTIONS'?'selected':''}>All execution actions</option>${Object.entries(VERBS).map(([k,v])=>`<option value="${k}" ${actFilter===k?'selected':''}>${v}</option>`).join('')}</optgroup>
      </select>
      <button class="btn" data-toast="CSV export includes the execution rows">Export CSV</button>
    </div>
    ${isOwner()?'':'<div class="hidden-note">Execution audit rows are shown to the project owner only. You see the other activities as before.</div>'}
    <div>${rows.length?rows.map(r=>`<div class="act-row"><div class="act-ic ${r.isEx?'':'old'}">${IC[r.icon]||''}</div><div class="act-text">${r.text}${r.note?`<span class="note">${esc(r.note)}</span>`:''}</div><div class="act-when">${r.at}</div></div>`).join(''):'<div class="empty">No activities match this filter.</div>'}</div>
  </section>
  <p class="note">The Activities page shows the last 30 days, as for every activity. Each execution's Audit tab keeps the full year.</p>`;
  $('#a-type').onchange=ev=>{actFilter=ev.target.value;renderActivities()};
  document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
}

document.querySelectorAll('.seg [data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.seg [data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b));route();toast(role==='owner'?'Viewing as owner':'Viewing as admin: destroy and the execution audit are owner-only')});
window.addEventListener('hashchange',route);
route();
</script>
